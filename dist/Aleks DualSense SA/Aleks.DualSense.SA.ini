; Alek's DualSense SA 2.2 - native DualSense over USB or Bluetooth (no Steam Input, DSX or ViGEm) / DualSense nativo por USB o Bluetooth.
; HD haptics need the USB cable; over Bluetooth classic rumble is used / la háptica HD necesita el cable.
; Turn Steam Input OFF for GTA San Andreas. / Apaga Steam Input para GTA San Andreas.
; 0 = off / apagado, 1 = on / encendido. Percentages / porcentajes 0-100.
; Changes made in game are saved to Documents\GTA San Andreas User Files\Aleks DualSense SA.ini, which overrides this file.
; Lo que cambies en el juego se guarda en ese archivo de Documentos, que manda sobre este INI.

[General]
Enabled=1
; 0 = no input or rumble while the game is not focused (Alt+Tab) / sin entrada ni vibración con Alt+Tab.
AllowBackgroundInput=0
; Touchpad click works as Select/Back (as well as Create) / el clic del touchpad funciona como Select.
TouchpadAsBack=1
; Own stick deadzone; leave 0 (GInput applies its own) / zona muerta propia; deja 0.
StickDeadzone=0
; Controller: 0 = auto (DualSense first if both are plugged in), 1 = DualSense only, 2 = DualShock 4 only.
; Control: 0 = auto (primero el DualSense si hay dos), 1 = solo DualSense, 2 = solo DualShock 4.
Controller=0
; Mute button in game / botón Mute en el juego:
;   tap / toque               = adaptive triggers on/off (mic LED on = off) / gatillos adaptativos sí/no
;   Mute + up/down            = vibration +10 / -10 % / vibración
;   Mute + right              = open/close the DualSense menu / abrir/cerrar el menú (see / ver [Menu])
MuteTogglesTriggers=1
; Write shots, hits, explosions and crashes to the log / escribir eventos en el log.
LogEvents=1

[Triggers]
AdaptiveTriggers=1
; On foot, every weapon has its own trigger / a pie, cada arma tiene su gatillo.
WeaponTriggers=1
WeaponStrength=70
; The shot fires right at the trigger's click / el disparo sale justo en el clic del gatillo. 0 = game default.
FireAtClick=1
; Driving: R2 throttle, firm L2 brake, L2 vibrates when skidding or with the handbrake / manejo.
DrivingTriggers=1
DrivingStrength=25
; Throttle resistance grows with speed / la resistencia del acelerador sube con la velocidad.
SpeedResponse=1

[Vibration]
; Overall strength (classic rumble and HD haptics) / fuerza general.
Vibration=65
; Extra volume while driving, on top of Vibration / volumen extra al manejar.
DrivingVibration=60
; The game's own rumble (through GInput) / la vibración del propio juego.
GameRumble=1
Shots=1
Damage=1
Explosions=1
Crashes=1
; Bumps, rough ground, landings and skids / baches, terreno, aterrizajes y derrapes.
Terrain=1
; No Sony pad? The mod's rumble effects go to an Xbox / XInput controller instead (also a DualShock 3 with DsHidMini).
; ¿Sin control de Sony? Las vibraciones del mod van a un control de Xbox / XInput (también DualShock 3 con DsHidMini).
XboxRumble=1

[Haptics]
; HD haptics: effects are waveforms played on the pad's actuators through its USB audio (channels 3-4).
; Háptica HD: las vibraciones son ondas que mueven los actuadores por la salida de audio del control.
; 0 = classic rumble / vibración clásica. If Windows' volume for the "DualSense" speakers is low, haptics are weak too.
HD=1
; Footsteps by surface (concrete, grass, sand, gravel, wood, metal, water) / pasos según el suelo.
Footsteps=1
; Gunshots felt from your weapon sound mod (EarShot folders, e.g. NextGen Weapon Sounds in Immersive Weapons Pack).
; Disparos que se sienten como suena tu mod de sonidos de armas (carpetas de EarShot, p. ej. NextGen Weapon Sounds).
SoundShots=1

[Lighting]
Lightbar=1
Brightness=100
; On foot: colour by health (green, yellow, red; it beats when low) / color según la vida.
HealthColor=1
; On foot: player LEDs show armour / los LEDs muestran la armadura.
ArmourLeds=1
; In vehicles: lightbar and LEDs work as a speedometer that fills at this speed / velocímetro.
Speedometer=1
SpeedometerKmh=160
; Red/blue flashes with a wanted level (faster with more stars) / luces de policía.
PoliceFlashes=1
; Colour in menus, pause, cutscenes and the Photo Mode / color en menús y pausa.
MenuRed=0
MenuGreen=80
MenuBlue=200

[Menu]
; Open the menu with: 0 = Mute + right, 1 = double tap down, 2 = key only.
; Abrir el menú con: 0 = Mute + derecha, 1 = doble toque abajo, 2 = solo la tecla.
OpenWith=0
; Keyboard key (Windows virtual-key code, 122 = F11; 0 = none) / tecla del teclado.
Key=122
; 0 = game language, 1 = Español, 2 = English
Language=0
